name: luma_mobile
description: LUMA mobile app for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  file_picker:
    path: third_party/file_picker
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/logo-mark.png
